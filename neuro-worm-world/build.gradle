plugins {
    id 'java'
    id 'application'
}

group = 'ru.mcs'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':neuro-worm-core')
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

application { mainClass = 'ru.mcs.neuroworm.world.Evolution' }