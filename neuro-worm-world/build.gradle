    mainClass = 'ru.mcs.neuroworm.world.AblationScan'
}

tasks.register('runSignedEvolution', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ru.mcs.neuroworm.world.Evolution'
    systemProperty 'neuroworm.data', '_signed'
}

tasks.register('runAblationScanSigned', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
