plugins {
    id 'java'
    id 'application'
}

group = 'ru.mcs'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':neuro-worm-core')
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}


tasks.register('runPlasticity', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ru.mcs.neuroworm.world.PlasticityEvolution'
}

tasks.register('runAblation', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ru.mcs.neuroworm.world.PlasticityAblation'
}

tasks.register('runPlasticityOdorOnly', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ru.mcs.neuroworm.world.PlasticityEvolution'
    systemProperty 'fixD0', 'true'
}

tasks.register('runControl', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ru.mcs.neuroworm.world.PlasticityControl'
}

tasks.register('runConditioning', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ru.mcs.neuroworm.world.ConditioningEvolution'
}

tasks.register('runConditioningControls', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
